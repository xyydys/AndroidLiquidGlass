name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        type: choice
        options: [Release, Debug]
        default: Release
  push:
    paths:
      - "iosApp/**"
      - "app/**"
      - "backdrop/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Give Gradle more memory for Kotlin/Native linking
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers

      - name: Build app (unsigned, iphoneos arm64)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP="build/ios/${CONFIGURATION}-iphoneos/Backdrop Catalog.app"
          test -d "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../BackdropCatalog-${CONFIGURATION}-unsigned.ipa" Payload)
          ls -lh BackdropCatalog-*.ipa
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: BackdropCatalog-${{ env.CONFIGURATION }}-unsigned-ipa
          path: BackdropCatalog-*.ipa
          if-no-files-found: error
          retention-days: 30
